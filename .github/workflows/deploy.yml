name: Deploy PS Reinigung Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ps-reinigung-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy demo to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          source: "index.html,product-images.js"
          target: "/tmp/ps-reinigung-release"
          overwrite: true

      - name: Publish and configure nginx + TLS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 15m
          script: |
            set -e
            DOMAIN="ps-reinigung.smarbiz.sbs"
            SITE_DIR="/var/www/$DOMAIN"
            VERSION="$(date +%s)"

            mkdir -p "$SITE_DIR"
            cp /tmp/ps-reinigung-release/index.html "$SITE_DIR/index.html"
            cp /tmp/ps-reinigung-release/product-images.js "$SITE_DIR/product-images.js"

            # Load the product-picture enhancement after the shop's original script.
            sed -i "s#</body>#  <script src=\"/product-images.js?v=$VERSION\"></script>\n</body>#" "$SITE_DIR/index.html"

            chmod 755 "$SITE_DIR"
            chmod 644 "$SITE_DIR/index.html" "$SITE_DIR/product-images.js"

            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            fi

            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi

            cat > "/etc/nginx/sites-available/$DOMAIN" <<'NGINX'
            server {
                listen 80;
                listen [::]:80;
                server_name ps-reinigung.smarbiz.sbs;

                root /var/www/ps-reinigung.smarbiz.sbs;
                index index.html;

                location /.well-known/acme-challenge/ {
                    root /var/www/ps-reinigung.smarbiz.sbs;
                    try_files $uri =404;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX

            ln -sfn "/etc/nginx/sites-available/$DOMAIN" "/etc/nginx/sites-enabled/$DOMAIN"
            nginx -t
            systemctl enable nginx
            systemctl restart nginx

            if ! command -v certbot >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y certbot python3-certbot-nginx
            fi

            if certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect; then
              echo "Let's Encrypt certificate installed."
            else
              echo "Let's Encrypt failed; enabling temporary HTTPS origin certificate."
              mkdir -p /etc/nginx/ssl
              if [ ! -f "/etc/nginx/ssl/$DOMAIN.crt" ]; then
                openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
                  -keyout "/etc/nginx/ssl/$DOMAIN.key" \
                  -out "/etc/nginx/ssl/$DOMAIN.crt" \
                  -subj "/CN=$DOMAIN"
              fi

              cat > "/etc/nginx/sites-available/$DOMAIN" <<'NGINX'
            server {
                listen 80;
                listen [::]:80;
                server_name ps-reinigung.smarbiz.sbs;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name ps-reinigung.smarbiz.sbs;

                ssl_certificate /etc/nginx/ssl/ps-reinigung.smarbiz.sbs.crt;
                ssl_certificate_key /etc/nginx/ssl/ps-reinigung.smarbiz.sbs.key;

                root /var/www/ps-reinigung.smarbiz.sbs;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX
            fi

            nginx -t
            systemctl restart nginx

            echo "---- Origin verification ----"
            curl -fsS -H "Host: $DOMAIN" http://127.0.0.1/ >/dev/null && echo "HTTP origin OK"
            curl -kfsS -H "Host: $DOMAIN" https://127.0.0.1/ >/dev/null && echo "HTTPS origin OK"
            curl -kfsS -H "Host: $DOMAIN" https://127.0.0.1/product-images.js | grep -q "product-photo" && echo "Product image script OK"
            grep -q "product-images.js" "$SITE_DIR/index.html" && echo "Product image script linked"
            ss -ltn | grep -E ':(80|443) ' || true

            rm -rf /tmp/ps-reinigung-release
            echo "PS Reinigung demo deployed successfully with item pictures."

      - name: Verify public Cloudflare URL
        run: |
          set -e
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/ps-body.html -w "%{http_code}" --max-time 15 https://ps-reinigung.smarbiz.sbs || true)
            echo "Public check attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              grep -qi "PS Reinigung" /tmp/ps-body.html
              grep -q "product-images.js" /tmp/ps-body.html
              curl -fsS --max-time 15 https://ps-reinigung.smarbiz.sbs/product-images.js -o /tmp/product-images.js
              grep -q "product-photo" /tmp/product-images.js
              echo "Public Cloudflare endpoint + product pictures OK"
              exit 0
            fi
            sleep 5
          done
          echo "Public endpoint did not become healthy in time."
          exit 1
